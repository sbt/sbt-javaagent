name: Scala CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            jobtype: 1
            java: 8
          - os: ubuntu-latest
            jobtype: 2
            java: 17
          - os: ubuntu-latest
            jobtype: 2
            java: 21
          - os: ubuntu-latest
            jobtype: 2
            java: 25
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 1.8
      uses: actions/setup-java@v6
      if: ${{ matrix.jobtype == 1 }}
      with:
        distribution: temurin
        java-version: 8
        cache: sbt
    - name: Setup modern JDK
      uses: actions/setup-java@v6
      if: ${{ matrix.jobtype != 1 }}
      with:
        distribution: temurin
        java-version: ${{ matrix.java }}
        cache: sbt
    - name: Install sbt
      uses: sbt/setup-sbt@v1
    - name: Build and test
      if: ${{ matrix.jobtype == 1 }}
      shell: bash
      # agent-2/* relies on sbt 2.x-only BOM/wildcard support (ModuleID#pomOnly), skip it here
      run: sbt -v '++ 2.12.x' 'scripted agent/* agent-1/*'
    - name: Scala 3
      if: ${{ matrix.jobtype == 2 }}
      shell: bash
      run: sbt -v '++ 3.x' 'scripted agent/* agent-2/*'
